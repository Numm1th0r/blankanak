<!DOCTYPE html>
<!-- Based on https://github.com/watchbutdonotlearn/watchbutdonotlearn.github.io -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOU GOT RICKROLLED</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <style>
    body {
      cursor: url("rick.PNG"), auto;
      font-family: Arial, Helvetica, sans-serif;
      background-image: url('youjustgotrickd.jpg');
    }
    .box {
      background-color: #ffffff;
      max-width: 800px;
      margin: 0 auto;
      transform: rotate(0.4deg);
      padding-bottom: 10px;
    }
    .center { text-align: center; }
    #gift {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
      color: #fff;
      cursor: pointer;
      background: radial-gradient(circle at 50% 40%, #ff4fa3 0%, #b0127a 45%, #3a0645 100%);
      user-select: none;
      -webkit-user-select: none;
      transition: opacity .25s ease;
    }
    #gift.gone { opacity: 0; pointer-events: none; }
    #gift .box-emoji {
      font-size: clamp(110px, 28vw, 240px);
      line-height: 1;
      animation: wiggle 1.2s ease-in-out infinite;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.35));
    }
    #gift h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 84px);
      line-height: 1.05;
      text-shadow: 0 4px 18px rgba(0,0,0,.35);
    }
    #gift button {
      font: inherit;
      font-size: clamp(22px, 5vw, 40px);
      font-weight: bold;
      padding: 18px 48px;
      border: 0;
      border-radius: 999px;
      color: #b0127a;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0) scale(1); }
      20% { transform: rotate(-10deg) scale(1.05); }
      40% { transform: rotate(10deg) scale(1.05); }
      60% { transform: rotate(-6deg) scale(1.02); }
      80% { transform: rotate(6deg) scale(1.02); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    #videorickroll {
      display: block;
      width: 100%;
      max-width: 720px;
      height: auto;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <div id="gift">
    <div class="box-emoji">🎁</div>
    <h1>Készen állsz az<br>ajándékodra?</h1>
    <button type="button">IGEN! 🎉</button>
  </div>

  <div class="box">
    <p class="center">Yo how do you like my epic website</p>
    <h1 class="center">LOL U GOT RICKROLLED</h1>
    <video id="videorickroll" disablePictureInPicture loop playsinline preload="auto">
      <source src="rickroll3.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <script src="script.js"></script>
</body>
</html>
